[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-sim"
version = "0.1.0"
description = "NBA player outcome simulation engine with chronological distributional validation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "typer>=0.12",
  "pyarrow>=15",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
nba-sim = "nba_sim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full raw dataset under data/raw (skipped if absent)"]
